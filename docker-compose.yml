 
version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=secretkey
      - REFRESH_TOKEN_SECRET=refreshsecretkey
      - WEATHER_API_KEY=${WEATHER_API_KEY}
    depends_on:
      - db
    networks:
      - wasel-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: wasel_project
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - wasel-network

volumes:
  mysql-data:

networks:
  wasel-network:
    driver: bridge
    - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root123
      - DB_NAME=wasel_project